name: Quilt
options:
  bundleIdPrefix: com.haozc
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 9SVLV5WMH6
    CODE_SIGN_STYLE: Automatic
targets:
  Quilt:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Support/Assets.xcassets
    dependencies:
      - target: QuiltWidget
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Quilt
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Support/Quilt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.haozc.quilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.Quilt
        PRODUCT_NAME: Quilt
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QuiltWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Shared
      - path: Sources/Localizable.xcstrings
      - path: Sources/Theme.swift
      - path: Sources/Models.swift
      - path: Sources/HabitsMath.swift
      - path: Sources/Store.swift
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Quilt
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Support/QuiltWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.haozc.quilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.Quilt.widget
        PRODUCT_NAME: QuiltWidget
        SWIFT_VERSION: "5.9"
        SKIP_INSTALL: YES
  QuiltTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Quilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.QuiltTests
        PRODUCT_NAME: QuiltTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
  QuiltUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Quilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haozc.QuiltUITests
        PRODUCT_NAME: QuiltUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Quilt
        SWIFT_VERSION: "5.9"
schemes:
  Quilt:
    build:
      targets:
        Quilt: all
        QuiltWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuiltTests
        - QuiltUITests
